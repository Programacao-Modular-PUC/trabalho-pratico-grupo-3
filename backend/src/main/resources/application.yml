server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB
  application:
    name: NoAirNoBnb
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/noairnobnb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: warn
    org.springframework.security: info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

noairnobnb:
  upload:
    root: ${UPLOAD_ROOT:./uploads}
    max-imagens-por-quarto: ${UPLOAD_MAX_IMAGENS_POR_QUARTO:24}
    max-bytes-por-arquivo: ${UPLOAD_MAX_BYTES:10485760}
  security:
    jwt:
      issuer: ${JWT_ISSUER:noairnobnb}
      secret: ${JWT_SECRET:CHANGE_ME_DEV_ONLY_please_override_CHANGE_ME_DEV_ONLY_please_override_CHANGE_ME_DEV_ONLY_please_override}
      expires-in-minutes: ${JWT_EXPIRES_MINUTES:180}
  business:
    diaria:
      checkin-hour: 12
      checkout-hour: 12
    pricing:
      extras:
        ar-condicionado: ${PRICING_EXTRA_AR:0.20}
        hidromassagem: ${PRICING_EXTRA_HIDRO:0.25}
      familia:
        # Diária base × (1 + fator × (hóspedes - 1))
        percentual-acrescimo-sobre-base-por-hospede-acima-primeiro: ${PRICING_FAM_PCT_HOSP:0.04}
        # Taxa diária fixa por ambiente distinto (estudo, home office, etc.)
        taxa-diaria-por-ambiente: ${PRICING_FAM_TAXA_AMB:12.00}
        # Cada hóspede a partir do 3º: desconto adicional, até teto
        desconto-progressivo-por-hospede-grupo: ${PRICING_FAM_DESC_POR_PESSOA:0.02}
        desconto-grupo-maximo: ${PRICING_FAM_DESC_MAX:0.20}

---
# Perfil opcional: MySQL (não é necessário para desenvolvimento local padrão)
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/noairnobnb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:noair}
    password: ${DB_PASSWORD:noair}
  h2:
    console:
      enabled: false
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
